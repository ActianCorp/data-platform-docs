# ----------------------------------------------------------------------------
# Theme
# ----------------------------------------------------------------------------
[project.theme]

# "modern" is Zensical's new default look-and-feel.
variant = "modern"

# Template override directory (relative to this config). Used only for the
# announcement bar: theme_overrides/main.html fills Zensical's `announce` block.
custom_dir = "theme_overrides"

language = "en"
logo = "assets/images/actian-logo.svg"
favicon = "assets/favicon.png"

# NOTE: theme_overrides/main.html is a minimal custom_dir override used ONLY to
# fill Zensical's `announce` block (the "moved from FrameMaker to Markdown"
# banner). Analytics (GA4) and the "View as Markdown" link remain handled by
# docs/javascripts/analytics.js and docs/javascripts/extra.js respectively,
# since Zensical's modern theme has no native hook for either in this setup.

# Full Zensical modern feature set. (content.action.edit/view are intentionally
# omitted: repo_url points at a Support contact page, not an editable repo.)
features = [
    "announce.dismiss",
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.tabs",
    "navigation.tabs.sticky",
    "navigation.top",
    "navigation.tracking",
    "search.highlight",
    "toc.follow",
]

[project.theme.icon]
repo = "material/lifebuoy"

# ----------------------------------------------------------------------------
# Color palette (light default + dark slate, indigo primary/accent)
# ----------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "default"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-4"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
scheme = "slate"
primary = "indigo"
accent = "indigo"
toggle.icon = "material/brightness-7"
toggle.name = "Switch to light mode"

# ----------------------------------------------------------------------------
# Markdown extensions — full Zensical recommended set (superset of the original
# MkDocs config; adds abbreviations, footnotes, math, keys, task lists, etc.)
# ----------------------------------------------------------------------------
[project.markdown_extensions.abbr]
[project.markdown_extensions.admonition]
[project.markdown_extensions.attr_list]
[project.markdown_extensions.def_list]
[project.markdown_extensions.footnotes]
[project.markdown_extensions.md_in_html]
[project.markdown_extensions.meta]
[project.markdown_extensions.tables]

[project.markdown_extensions.toc]
title = "On this page"
permalink = true

[project.markdown_extensions.pymdownx.arithmatex]
generic = true

[project.markdown_extensions.pymdownx.betterem]
[project.markdown_extensions.pymdownx.caret]
[project.markdown_extensions.pymdownx.details]
[project.markdown_extensions.pymdownx.inlinehilite]
[project.markdown_extensions.pymdownx.keys]
[project.markdown_extensions.pymdownx.mark]
[project.markdown_extensions.pymdownx.smartsymbols]
[project.markdown_extensions.pymdownx.snippets]
[project.markdown_extensions.pymdownx.tilde]

[project.markdown_extensions.pymdownx.magiclink]
repo_url_shorthand = true

[project.markdown_extensions.pymdownx.highlight]
use_pygments = true
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true
auto_title = false
linenums = false

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true
combine_header_slug = true

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.pymdownx.superfences]
custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
