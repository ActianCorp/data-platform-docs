# ============================================================================
# Zensical configuration for the Actian Data Platform documentation portal.
#
# Converted from mkdocs.yml (Material for MkDocs) to the Zensical authoring
# template. Content Markdown, CSS and JavaScript are unchanged.
#   Docs:  https://zensical.org/docs/setup/basics/
# ============================================================================

[project]

site_name = "Actian Data Platform"
site_url = "https://docs.actian.com/actiandataplatform/"
site_description = """
Complete documentation for the Actian Data Platform — warehousing, connectivity, SQL, integrations, data quality, security, and more.
"""

# Preserve the existing (non-directory) URL scheme so bookmarks/links keep working.
use_directory_urls = false

docs_dir = "docs"
site_dir = "site"

copyright = """
Copyright &copy; 2026, Actian
"""

# Header "Support" pill (was repo_url/repo_name in mkdocs.yml).
repo_url = "https://www.actian.com/contact/"
repo_name = "Support"

# Additional CSS / JS (paths are relative to docs_dir).
extra_css = ["stylesheets/site-theme.css"]
extra_javascript = ["javascripts/analytics.js", "javascripts/extra.js"]

